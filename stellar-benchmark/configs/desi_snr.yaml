name: desi_dr1_r_arm_snr
input_npz: data/processed/desi_r_raw.npz
output_dir: results/desi_case_study
random_state: 42

valid_fraction_min: 0.95
snr_min: 10.0
teff_range: [3200.0, 8000.0]
logg_range: [2.0, 5.5]
feh_range: [-3.0, 0.5]
teff_error_max: 150.0
logg_error_max: 0.20
feh_error_max: 0.30

source_train_fraction: 0.60
source_holdout_fraction: 0.20
target_adaptation_fraction: 0.10
target_evaluation_fraction: 0.10

wavelength_min: 5800.0
wavelength_max: 7580.0
continuum_window: 301
continuum_polyorder: 3
outlier_percentiles: [0.01, 99.99]
pca_components: 64

n_estimators: 400
min_samples_leaf: 2
max_features: 0.70

noise_factors: [1.25, 1.50, 2.0, 2.5, 3.0]
noise_seed_start: 2026
noise_seed_count: 10
adaptation_noise_factor: 2.0
adaptation_noise_seed: 2026

augmentation_views: 2
augmentation_seed_start: 4042
