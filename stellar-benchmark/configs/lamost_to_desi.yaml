name: lamost_dr2_to_desi_dr1_apogee_dr12_v1
source_npz: data/processed/lamost_apogee_dr12.npz
target_npz: data/processed/desi_apogee_dr12.npz
output_dir: results/lamost_dr2_to_desi_dr1_apogee_dr12
source_survey: LAMOST_DR2_HO2017
target_survey: DESI_DR1_SPARCL
source_label_provenance: Ho et al. 2017 public high-SNR LAMOST tutorial set with direct APOGEE DR12 ASPCAP v603 labels
target_label_provenance: APOGEE DR12 allStar-v603 crossmatched at 1.5 arcsec to primary DESI DR1 SPARCL spectra
source_label_scale: APOGEE_DR12_ASPCAP_v603_calibrated_TEFF_LOGG_PARAM_M_H
target_label_scale: APOGEE_DR12_ASPCAP_v603_calibrated_TEFF_LOGG_PARAM_M_H

source_resolving_power: 1800.0
target_resolving_power: 2500.0
common_resolving_power: 1800.0
wavelength_min: 4000.0
wavelength_max: 5500.0
log_wavelength_step: 0.0002
valid_fraction_min: 0.95
source_holdout_fraction: 0.20
target_adaptation_fraction: 0.30
random_state: 42

continuum_window: 101
continuum_polyorder: 3
outlier_percentiles: [0.01, 99.99]
pca_components: 64
n_estimators: 400
min_samples_leaf: 2
max_features: 0.70
conformal_alpha: 0.10
coral_regularization: 0.001
label_budgets: [5, 10, 25, 50, 100]
label_budget_repeats: 10
bootstrap_replicates: 1000
bootstrap_confidence: 0.95
ood_coverages: [1.0, 0.9, 0.8, 0.7, 0.5]
subgroup_minimum: 20
ablation_models: [ridge, extra_trees, mlp]
ablation_estimators: 150
isochrone_grid_csv: null
isochrone_threshold_quantile: 0.99

# The public-result configuration refuses to run until the label scale and
# sample support are strong enough for a defensible cross-survey claim.
enforce_publication_gate: true
publication_min_source_train: 1000
publication_min_source_holdout: 200
publication_min_target_adaptation: 100
publication_min_target_evaluation: 350
publication_min_giants: 50
publication_min_metal_poor: 50
